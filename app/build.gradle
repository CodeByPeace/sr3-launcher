plugins { id 'com.android.application' }
android {
    namespace 'com.sr3launcher'
    compileSdk 34
    defaultConfig {
        applicationId 'com.sr3.launcher'
        minSdk 30
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    buildTypes { release { minifyEnabled false } }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    // Подпись релиза: положите keystore.properties рядом с корнем проекта (storeFile, storePassword, keyAlias, keyPassword).
    // Без него release-сборка подписывается отладочным ключом.
    def ksFile = rootProject.file('keystore.properties')
    if (ksFile.exists()) {
        def ks = new Properties()
        ksFile.withInputStream { ks.load(it) }
        signingConfigs {
            rel {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
        buildTypes.release.signingConfig = signingConfigs.rel
    } else {
        buildTypes.release.signingConfig = signingConfigs.debug
    }
}
dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
